name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version format
        run: echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'

      - name: Bump versions
        run: |
          V="${{ inputs.version }}"
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"$V\"/" src/git_repo_monitor/__init__.py
          sed -i -E "s/^const VERSION = \".*\";/const VERSION = \"$V\";/" card/src/git-repo-monitor-card.ts
          (cd card && npm version "$V" --no-git-tag-version --allow-same-version)

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Tests
        run: pip install -e ".[test]" && python -m pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build card
        working-directory: card
        run: npm install && npm run build

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/git_repo_monitor/__init__.py card/src/git-repo-monitor-card.ts card/package.json
          git diff --cached --quiet || git commit -m "Release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD --tags

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: card/dist/git-repo-monitor-card.js

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/elwinmage/ha-git-repo-monitor:${{ inputs.version }}
            ghcr.io/elwinmage/ha-git-repo-monitor:latest
