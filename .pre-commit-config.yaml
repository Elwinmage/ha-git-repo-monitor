repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^card/tsconfig\.json$
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest (100 % coverage)
        language: python
        entry: python -m pytest -q -p no:cacheprovider
        pass_filenames: false
        always_run: true
        additional_dependencies:
          - aiohttp
          - aiomqtt
          - PyYAML
          - watchfiles
          - pytest
          - pytest-asyncio
          - pytest-cov
